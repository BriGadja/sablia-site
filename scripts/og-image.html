<!doctype html>
<!--
  OG / Twitter image template (1200x630), rendered by scripts/og-image.mjs.
  The three marker comments below (FONTS, SYMBOL, TITLE) are filled in by the script: the fonts are the site's own
  (@fontsource files inlined as data URIs), the symbol is client/public/brand/symbol.svg, the title
  is of1.title read from client/src/content/of1.ts.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      /*FONTS*/
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #f5f2ec;
        color: #141413;
        font-family: 'Inter Variable', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 64px;
        position: relative;
        overflow: hidden;
      }
      body::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #cc785c;
      }
      .lockup { display: flex; align-items: center; gap: 22px; }
      .lockup svg { width: 88px; height: 88px; display: block; }
      .wordmark {
        font-family: 'Cormorant Garamond Variable', serif;
        font-weight: 500;
        font-size: 64px;
        letter-spacing: -1px;
        line-height: 1;
      }
      h1 {
        font-family: 'Cormorant Garamond Variable', serif;
        font-weight: 500;
        font-size: 72px;
        line-height: 1.05;
        letter-spacing: -1.5px;
        max-width: 960px;
      }
      .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; color: #6c6a64; }
      .foot strong { color: #141413; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="lockup"><!--SYMBOL--><span class="wordmark">Sablia</span></div>
    <h1><!--TITLE-->.</h1>
    <div class="foot"><span>Agence d'intégration Claude AI × CRM</span><strong>sablia.io</strong></div>
  </body>
</html>
