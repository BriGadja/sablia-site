<!doctype html>
<!--
  OG / Twitter image template (1200x630), rendered by scripts/og-image.mjs.
  The three marker comments below (FONTS, SYMBOL, TITLE) are filled in by the script: the fonts are the site's own
  (src/app/fonts woff2 inlined as data URIs), the symbol is public/brand/symbol.svg, the line
  is the home H1 or of1.title (see og-image.mjs).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      /*FONTS*/
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #161B29;
        color: #F4ECDD;
        font-family: 'Familjen Grotesk', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 64px;
        position: relative;
        overflow: hidden;
      }
      body::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #D9A441;
      }
      .lockup { display: flex; align-items: center; gap: 22px; }
      .lockup svg { width: 88px; height: 88px; display: block; }
      .wordmark {
        font-family: 'Familjen Grotesk', sans-serif;
        font-weight: 600;
        font-size: 64px;
        letter-spacing: -2px;
        line-height: 1;
      }
      h1 {
        font-family: 'Familjen Grotesk', sans-serif;
        font-weight: 600;
        font-size: 88px;
        line-height: 1.04;
        letter-spacing: -2.6px;
        text-wrap: balance;
        max-width: 960px;
      }
      .foot { display: flex; justify-content: space-between; align-items: baseline; font-family: 'Fragment Mono', monospace; font-size: 24px; color: #A4AABD; }
      .foot strong { color: #D9A441; font-weight: 400; }
    </style>
  </head>
  <body>
    <div class="lockup"><!--SYMBOL--><span class="wordmark">Sablia</span></div>
    <h1><!--TITLE-->.</h1>
    <div class="foot"><span>Agence d'intégration Claude AI × CRM</span><strong>sablia.io</strong></div>
  </body>
</html>
