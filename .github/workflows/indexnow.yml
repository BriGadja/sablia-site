# MANUAL fallback for IndexNow. Since the move to our own server (plan sablia-io-lot0-vps) the
# submission is made by deploy/deploy.sh itself after every successful production switch (gate:
# INDEXNOW_ENABLED in /etc/sablia-site/deploy.env on the host), because Vercel no longer emits the
# `deployment_status` event this workflow used to wait for. Run it by hand to (re)submit URLs, e.g.
# after a host problem. URL selection = sitemap diff, or every URL with `all` (scripts/seo/indexnow.mjs).
# 422/429 answers are warnings, not failures.
name: IndexNow

on:
  workflow_dispatch:
    inputs:
      new_url:
        description: 'Base URL whose /sitemap.xml is the new sitemap'
        required: false
        default: 'https://sablia.io'
      previous_url:
        description: 'Base URL whose /sitemap.xml is the previous sitemap (empty = submit everything)'
        required: false
        default: ''
      all:
        description: 'Submit every URL of the new sitemap'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit to IndexNow
        env:
          NEW_URL: ${{ inputs.new_url }}
          PREV_URL: ${{ inputs.previous_url }}
          ALL: ${{ inputs.all }}
        run: |
          case "$NEW_URL" in https://sablia.io|https://sablia.io/) ;; *) echo "only https://sablia.io is accepted"; exit 2;; esac
          args=(--sitemap "${NEW_URL%/}/sitemap.xml")
          if [ "$ALL" = true ] || [ -z "$PREV_URL" ]; then
            args+=(--all)
          else
            args+=(--previous-sitemap "${PREV_URL%/}/sitemap.xml")
          fi
          node scripts/seo/indexnow.mjs "${args[@]}"
